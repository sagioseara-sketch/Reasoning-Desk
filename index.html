<style>

.chip.set{border-style:solid;border-color:var(--cta)}
.ringpad{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:12px auto 0}

.go{margin:14px 0 12px}

.grid{gap:16px 14px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;gap:4px;min-height:212px;padding:11px;border:3px solid var(--bd);border-radius:28px;background:var(--c);color:#fff;text-align:left;box-shadow:0 7px 0 var(--bd);margin-bottom:6px;transition:transform .1s,box-shadow .1s}

.tb{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:0}

.pb{width:100%;height:34px;margin-top:8px;border-radius:12px;background:rgba(0,0,0,.26);display:grid;place-items:center;font:800 14px Figtree,sans-serif}

const XY=(s,i)=>{if(s.cor&&s.n==8)return[[16,16],[50,16],[84,16],[84,50],[84,84],[50,84],[16,84],[16,50]][i];if(s.cor)return[[50,14],[69,46],[88,80],[50,80],[12,80],[31,46]][i];const a=2*Math.PI*i/s.n;return[50+38*Math.sin(a),50-38*Math.cos(a)]};
